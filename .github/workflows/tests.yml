# Lance l'ensemble des tests à chaque push et pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installer les dépendances
        run: |
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (vérification TypeScript incluse)
        run: npm run build
      - name: Tests des transformations graphiques
        working-directory: .
        run: node tests/js/test_transforms.js
